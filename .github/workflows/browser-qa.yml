name: Site-comparador - browser UX QA staging
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright in ephemeral runner
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real browser test on deployed HTTPS staging
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
          const tests=[];
          try {
            for (const viewport of [{width:390,height:844,name:'mobile'},{width:1366,height:900,name:'desktop'}]) {
              const page=await browser.newPage({viewport,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',err=>errors.push('pageerror:'+err.message));
              page.on('console',msg=>{if(msg.type()==='error')errors.push('console:'+msg.text())});
              const response=await page.goto('https://comparador-teste.duckdns.org/',{waitUntil:'networkidle',timeout:40000});
              assert.equal(response.status(),200);
              await page.locator('.product-card').first().waitFor({timeout:15000});
              assert.equal(await page.locator('.product-card').count(),5);
              assert.equal(await page.locator('a.buy-btn').count(),0,'No active affiliate links in demo');
              assert.equal(await page.locator('.comparison-table th').count(),5,'Default 4 compared products');
              await page.locator('#source-awin').click();
              await page.waitForFunction(()=>document.querySelector('#source-awin')?.getAttribute('aria-pressed')==='true' && document.querySelectorAll('.product-card').length===5);
              assert.equal(await page.locator('.product-card').count(),5);
              assert.equal(await page.locator('a.buy-btn').count(),0);
              await page.locator('#source-amazon').click();
              await page.waitForFunction(()=>document.querySelector('#source-amazon')?.getAttribute('aria-pressed')==='true' && document.querySelectorAll('.product-card').length===5);
              await page.locator('#search').fill('impossivel-de-encontrar-000');
              assert.match(await page.locator('#products').innerText(),/Não encontrámos resultados/);
              await page.locator('#search').fill('');
              assert.equal(await page.locator('.product-card').count(),5);
              const width=await page.evaluate(()=>({viewport:window.innerWidth,document:document.documentElement.scrollWidth}));
              assert.ok(width.document<=width.viewport+3,JSON.stringify(width));
              assert.equal(errors.length,0,errors.join('; '));
              await page.screenshot({path:'artifacts/comparador-'+viewport.name+'.png',fullPage:true});
              tests.push({viewport:viewport.name,productCards:5,selectedDefault:4,amazonAndAwin:true,search:true,noBuyLinks:true,noOverflow:true,jsErrors:0,https:true});
              await page.close();
            }
            fs.writeFileSync('artifacts/browser-qa-report.json',JSON.stringify({status:'passed',site:'https://comparador-teste.duckdns.org/',tests},null,2));
            console.log('COMPARADOR_BROWSER_QA=PASS '+JSON.stringify(tests));
          } finally {await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparador-browser-ux-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
