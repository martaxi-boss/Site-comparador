name: Site-comparador - indexed catalog CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only pinned source dependencies in runner
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node -e "console.log('PRODUCT_MATCHER_RESOLVED='+require('product-matcher/package.json').version)"
      - name: Run Node syntax, tests and commercial safety gates
        run: |
          set -euo pipefail
          for file in server.mjs public/pro.js src/catalog.mjs src/taxonomy.mjs src/search-index.mjs scripts/match-review.mjs src/providers/*.mjs; do node --check "$file"; done
          npm test
          test -f public/robots.txt
          grep -qi 'noindex' public/index.html
          test ! -f data/active-amazon.json
          test ! -f data/active-awin.json
          node scripts/match-review.mjs data/demo-amazon.json > "$RUNNER_TEMP/match-review.json"
          node --input-type=module -e '
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/match-review.json"));
          assert.equal(x.items,55);
          assert.equal(x.auto_merged,0);
          assert.ok(x.hints.every(h=>h.action==="REVIEW_ONLY"));
          console.log("MATCHING_REVIEW_ONLY=PASS");
          '
          echo COMPARADOR_TESTS_AND_GATES=PASS
      - name: Verify actual HTTP and paginated search API
        run: |
          set -euo pipefail
          PORT=4173 node server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/health' -o "$RUNNER_TEMP/health.json"; then ok=1; break; fi
            sleep 1
          done
          test "$ok" -eq 1
          for path in / /pro.css /pro.js /robots.txt '/api/search?source=amazon&limit=12' '/api/search?source=awin&category=fritadeiras' '/api/categories?source=amazon' '/api/product?source=amazon&id=demo-amazon-fritadeiras-1'; do
            curl -fsS "http://127.0.0.1:4173$path" -o /dev/null
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='http://127.0.0.1:4173';
          const get=async p=>(await fetch(url+p)).json();
          const h=await get('/health');
          assert.equal(h.status,'ok');
          assert.equal(h.catalog.count.amazon,55);
          const a=await get('/api/search?source=amazon&limit=12');
          assert.equal(a.total,55);
          assert.equal(a.items.length,12);
          assert.ok(a.items.every(p=>!p.canBuy&&p.affiliateUrl===null));
          const b=await get('/api/search?source=awin&category=fritadeiras');
          assert.equal(b.total,5);
          const categories=await get('/api/categories?source=amazon');
          assert.equal(categories.total,55);
          assert.equal(categories.categories.length,6);
          const page=await (await fetch(url+'/')).text();
          assert.ok(page.includes('noindex')&&page.includes('pro.js'));
          console.log('COMPARADOR_HTTP_SEARCH=PASS');
          NODE
