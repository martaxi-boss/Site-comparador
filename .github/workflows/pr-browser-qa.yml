name: Site-comparador - PR browser usability
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend test runner in ephemeral sandbox
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser QA on the proposed new version (not production)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PORT=4173 node server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          CHILD=$!
          trap 'kill "$CHILD" || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/health >/dev/null && break || sleep 1
          done
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const report=[];
          try{
            for(const viewport of [{width:390,height:844,name:'mobile'},{width:1366,height:900,name:'desktop'}]){
              const page=await browser.newPage({viewport,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:40000});
              assert.equal(response.status(),200);
              await page.locator('.product-card').first().waitFor();
              assert.equal(await page.locator('.category-card').count(),6);
              assert.equal(await page.locator('.product-card').count(),12);
              assert.equal(await page.locator('a.buy-button.enabled').count(),0);
              await page.locator('#catalog-search').fill('fritadeira');
              await page.waitForFunction(()=>document.querySelectorAll('.product-card').length===5 && document.querySelector('#results-description').textContent.includes('fritadeira'));
              assert.equal(await page.locator('.product-card').count(),5);
              await page.locator('button[data-add]').first().click();
              await page.locator('button[data-add]').nth(1).click();
              await page.waitForFunction(()=>document.querySelector('#dock-count').textContent==='2');
              assert.equal(await page.locator('.comparison-table th').count(),3);
              await page.locator('#source-awin').click();
              await page.waitForFunction(()=>document.querySelector('#source-awin').getAttribute('aria-pressed')==='true' && document.querySelectorAll('.product-card').length===12);
              assert.equal(await page.locator('#dock-count').textContent(),'0');
              assert.equal(await page.locator('a.buy-button.enabled').count(),0);
              const dims=await page.evaluate(()=>({screen:window.innerWidth,scroll:document.documentElement.scrollWidth}));
              assert.ok(dims.scroll<=dims.screen+3,JSON.stringify(dims));
              assert.deepEqual(errors,[],JSON.stringify(errors));
              await page.screenshot({path:'artifacts/pro-'+viewport.name+'.png',fullPage:true});
              report.push({viewport:viewport.name,categories:6,paginated:12,queryResults:5,comparison:2,sourceSwitch:true,disabledDemoLinks:true,noPageErrors:true,documentWidth:dims.scroll});
              await page.close();
            }
            fs.writeFileSync('artifacts/qa.json',JSON.stringify({status:'passed',scope:'local PR test with demo data',report},null,2));
            console.log('COMPARADOR_PR_BROWSER=PASS '+JSON.stringify(report));
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparador-pr-professional-ui-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
