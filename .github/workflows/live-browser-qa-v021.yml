name: Site-comparador - final live browser QA v0.2.1
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-browser-qa-v021.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright only on ephemeral runner
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Verify real deployed mobile/desktop journeys
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const origin='https://comparador-teste.duckdns.org';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const report=[];
          try {
            for (const viewport of [{width:390,height:844,name:'mobile'},{width:1366,height:900,name:'desktop'}]) {
              const page=await browser.newPage({viewport,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push('js:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              const result=await page.goto(origin+'/',{waitUntil:'networkidle',timeout:40000});
              assert.equal(result.status(),200);
              assert.match((await page.locator('meta[name=robots]').getAttribute('content'))||'',/noindex/);
              await page.locator('.product-card').first().waitFor({timeout:15000});
              assert.equal(await page.locator('.category-card').count(),6);
              assert.equal(await page.locator('.brand-icon').first().evaluate(el=>getComputedStyle(el).display),'flex');
              const mark=await page.locator('.brand-icon').first().boundingBox();
              const glyph=await page.locator('.brand-icon span').first().boundingBox();
              assert.ok(glyph.y>=mark.y&&glyph.y+glyph.height<=mark.y+mark.height+1,'brand mark must not overflow vertically');
              assert.equal(await page.locator('.product-card').count(),12);
              assert.equal(await page.locator('a.buy-button.enabled').count(),0);
              const health=await page.request.get(origin+'/health');
              assert.equal(health.status(),200);
              const healthData=await health.json();
              assert.equal(healthData.version,'0.2.1');
              assert.equal(healthData.catalog.count.amazon,55);
              assert.equal(healthData.catalog.count.awin,55);
              const automatic=await (await page.request.get(origin+'/api/search?source=auto&q=fritadeira')).json();
              assert.equal(automatic.source,'amazon');
              assert.equal(automatic.mode,'demo');
              assert.equal(automatic.total,5);
              await page.screenshot({path:'artifacts/live-'+viewport.name+'-top.png'});
              await page.locator('#catalog-search').fill('fritadeira');
              await page.waitForFunction(()=>document.querySelectorAll('.product-card').length===5 && document.querySelector('#results-description')?.textContent.includes('fritadeira'),{timeout:15000});
              assert.equal(await page.locator('.product-card').count(),5);
              await page.locator('button[data-add]').nth(0).click();
              await page.locator('button[data-add]').nth(1).click();
              await page.waitForFunction(()=>document.querySelector('#dock-count')?.textContent==='2');
              assert.equal(await page.locator('.comparison-table th').count(),3);
              await page.locator('#source-awin').click();
              await page.waitForFunction(()=>document.querySelector('#source-awin')?.getAttribute('aria-pressed')==='true'&&document.querySelectorAll('.product-card').length===12);
              assert.equal(await page.locator('#dock-count').textContent(),'0');
              assert.equal(await page.locator('a.buy-button.enabled').count(),0);
              const dims=await page.evaluate(()=>({viewport:window.innerWidth,scroll:document.documentElement.scrollWidth}));
              assert.ok(dims.scroll<=dims.viewport+3,JSON.stringify(dims));
              assert.deepEqual(errors,[],JSON.stringify(errors));
              await page.screenshot({path:'artifacts/live-'+viewport.name+'-full.png',fullPage:true});
              report.push({viewport:viewport.name,publicHttps:true,version:healthData.version,groups:6,perSourceItems:55,firstPage:12,searchResults:5,comparison:2,sourceSwitch:true,automaticSource:true,noActiveAffiliateLinks:true,noConsoleErrors:true,noOverflow:true});
              await page.close();
            }
            fs.writeFileSync('artifacts/live-browser-report.json',JSON.stringify({site:origin,status:'passed',report},null,2));
            console.log('COMPARADOR_PUBLIC_BROWSER_QA=PASS '+JSON.stringify(report));
          } finally { await browser.close(); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparador-v021-final-public-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 21
